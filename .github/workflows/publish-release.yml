name: publish-release
run-name: publish-release ${{ inputs.version || 'plugin.cfg' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.1. Empty reads plugin.cfg."
        required: false
        type: string
      dry_run:
        description: "Run validation without creating a tag or release, and record a reusable dry-run result."
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish-release:
    runs-on: windows-2025

    steps:
      - name: Validate release source branch
        env:
          RELEASE_SOURCE_REF: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RELEASE_SOURCE_REF -ne "dev") {
            throw "One-click releases must run from dev. Actual workflow ref: $env:RELEASE_SOURCE_REF"
          }

      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Fetch release refs
        shell: pwsh
        run: git fetch --force --tags origin +refs/heads/dev:refs/remotes/origin/dev

      - name: Run one-click release preflight
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $headSha = (git rev-parse HEAD).Trim()
          $devSha = (git rev-parse origin/dev).Trim()
          if ($headSha -ne $devSha) {
            throw "Checked out release source $headSha does not match origin/dev $devSha."
          }

          $pluginCfg = Get-Content -LiteralPath "addons/godot_dotnet_mcp/plugin.cfg" -Raw -Encoding UTF8
          if ($pluginCfg -notmatch 'version="([^"]+)"') {
            throw "Cannot find version in addons/godot_dotnet_mcp/plugin.cfg"
          }

          $pluginVersion = $Matches[1]
          $version = ([string]$env:INPUT_VERSION).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = $pluginVersion
          }
          if ($version -ne $pluginVersion) {
            throw "Input version $version does not match plugin.cfg version $pluginVersion."
          }

          $semverPattern = '0|[1-9]\d*'
          $prereleaseIdentifierPattern = '(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          $versionPattern = "^(($semverPattern)\.($semverPattern)\.($semverPattern)(?:-$prereleaseIdentifierPattern(?:\.$prereleaseIdentifierPattern)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)$"
          if ($version -notmatch $versionPattern) {
            throw "Release version must be SemVer. Actual version: $version"
          }

          $tagName = "v$version"
          $tagExists = $false
          $localTag = (@(git tag --list $tagName) -join "`n").Trim()
          if (-not [string]::IsNullOrWhiteSpace($localTag)) {
            $tagExists = $true
            $tagTargetSha = (git rev-parse "$tagName^{commit}").Trim()
            if ($tagTargetSha -ne $headSha) {
              throw "Release tag $tagName already exists at $tagTargetSha, not target $headSha."
            }
          }

          gh release view $tagName *> $null
          $releaseLookupExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($releaseLookupExit -eq 0) {
            throw "GitHub Release $tagName already exists. Choose a new version."
          }
          if ($releaseLookupExit -ne 1) {
            throw "Unable to check whether GitHub Release $tagName exists. gh exited with $releaseLookupExit."
          }

          $versionMentionPattern = "(?<![0-9A-Za-z.-])(?:[vV])?$([regex]::Escape($version))(?![0-9A-Za-z.-])"
          .\scripts\validate_release_changelog_section.ps1 -Version $version

          $releaseNotePaths = @(
            "docs/en/process/release-notes/release-notes-v$version.md",
            "docs/zh-CN/流程/发布说明/发布说明-v$version.md",
            "docs/ja/プロセス/リリースノート/リリースノート-v$version.md",
            "docs/ko/프로세스/릴리스-노트/릴리스-노트-v$version.md"
          )
          foreach ($releaseNotesPath in $releaseNotePaths) {
            if (-not (Test-Path -LiteralPath $releaseNotesPath)) {
              throw "Manual release notes file $releaseNotesPath is required for a formal release."
            }

            $releaseNotes = Get-Content -LiteralPath $releaseNotesPath -Raw -Encoding UTF8
            if ($releaseNotes -notmatch $versionMentionPattern) {
              throw "$releaseNotesPath does not mention release version $version"
            }
          }

          .\scripts\validate_docs_i18n.ps1

          $isPrerelease = (($version -match '^\d+\.\d+\.\d+-').ToString().ToLowerInvariant())
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag_name=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "target_sha=$headSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag_exists=$($tagExists.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "dry_run_cache_prefix=publish-release-dry-run-$tagName-$headSha-" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Value "## Release Preflight"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Value "- Version: ``$version``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Value "- Tag: ``$tagName``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Value "- Target SHA: ``$headSha``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Value "- Existing tag on target: ``$($tagExists.ToString().ToLowerInvariant())``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Value "- Dry run: ``$env:DRY_RUN``"

      - name: Restore matching dry-run record
        id: dry_run_record
        uses: actions/cache/restore@v4
        with:
          path: .release-dry-run-cache
          key: ${{ steps.preflight.outputs.dry_run_cache_prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.preflight.outputs.dry_run_cache_prefix }}

      - name: Evaluate reusable dry-run record
        id: reuse_dry_run
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          TAG_NAME: ${{ steps.preflight.outputs.tag_name }}
          VERSION: ${{ steps.preflight.outputs.version }}
          TARGET_SHA: ${{ steps.preflight.outputs.target_sha }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $skipRepeatedTests = "false"
          $recordPath = ".release-dry-run-cache\publish-release.json"

          if ($env:DRY_RUN -eq "false" -and (Test-Path -LiteralPath $recordPath)) {
            try {
              $record = Get-Content -LiteralPath $recordPath -Raw -Encoding UTF8 | ConvertFrom-Json
              $recordedAt = [DateTimeOffset]::Parse([string]$record.dry_run_completed_at)
              $recordAge = [DateTimeOffset]::UtcNow - $recordedAt
              if (
                $record.tag_name -eq $env:TAG_NAME -and
                $record.version -eq $env:VERSION -and
                $record.target_sha -eq $env:TARGET_SHA -and
                $record.build_checked -eq $true -and
                $record.harness_checked -eq $true -and
                $record.release_notes_rendered -eq $true -and
                $recordAge.TotalHours -le 24
              ) {
                $skipRepeatedTests = "true"
              }
            } catch {
              $skipRepeatedTests = "false"
            }
          }

          "skip_repeated_tests=$skipRepeatedTests" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Report reused dry-run validation
        if: ${{ steps.reuse_dry_run.outputs.skip_repeated_tests == 'true' }}
        env:
          TAG_NAME: ${{ steps.preflight.outputs.tag_name }}
          TARGET_SHA: ${{ steps.preflight.outputs.target_sha }}
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Value "Reusing successful dry-run validation for ``$env:TAG_NAME`` at ``$env:TARGET_SHA``."
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Value "Build and harness verification were skipped because the target commit is unchanged."

      - name: Verify hosted .NET 8 SDK
        if: ${{ steps.reuse_dry_run.outputs.skip_repeated_tests != 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet --info
          dotnet --list-sdks
          $sdkVersion = dotnet --version
          if ($sdkVersion -notmatch '^8\.') {
            throw "Expected global.json to select a .NET 8 SDK, got $sdkVersion."
          }

      - name: Build plugin Roslyn library
        if: ${{ steps.reuse_dry_run.outputs.skip_repeated_tests != 'true' }}
        shell: pwsh
        run: dotnet build .\addons\godot_dotnet_mcp\.dotnet_bridge\DotnetBridge.csproj -c Release

      - name: Setup Godot 4.6
        if: ${{ steps.reuse_dry_run.outputs.skip_repeated_tests != 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $godotZip = "$env:TEMP\Godot_v4.6-stable_mono_win64.exe.zip"
          if (-not (Test-Path $godotZip)) {
            curl.exe -L --fail --output $godotZip "https://downloads.godotengine.org/?version=4.6&flavor=stable&slug=mono_win64.zip&platform=windows.64"
          }
          $extractDir = "$env:TEMP\godot_extracted"
          Expand-Archive -Path $godotZip -DestinationPath $extractDir -Force
          $godotExe = Get-ChildItem -Path $extractDir -Recurse -Filter "*console*.exe" -File | Sort-Object FullName | Select-Object -First 1
          if ($null -eq $godotExe) {
            throw "Cannot find the Godot console executable in $extractDir."
          }
          echo "GODOT_BIN=$($godotExe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run plugin harness verification
        if: ${{ steps.reuse_dry_run.outputs.skip_repeated_tests != 'true' }}
        shell: pwsh
        run: .\scripts\test_plugin_side_roslyn.ps1 -GodotPath "$env:GODOT_BIN"

      - name: Render release notes
        id: release_notes
        env:
          VERSION: ${{ steps.preflight.outputs.version }}
          TAG_NAME: ${{ steps.preflight.outputs.tag_name }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes-$env:VERSION.md"

          .\scripts\render_release_notes.ps1 `
            -Version $env:VERSION `
            -OutputPath $notesFile `
            -ManualNotesPath "docs/en/process/release-notes/release-notes-v$env:VERSION.md" `
            -ChangelogPath "docs/en/CHANGELOG.md" `
            -TagName $env:TAG_NAME `
            -CommitLimit 30

          "notes_file=$notesFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Report dry run result
        if: ${{ inputs.dry_run }}
        env:
          TAG_NAME: ${{ steps.preflight.outputs.tag_name }}
          TARGET_SHA: ${{ steps.preflight.outputs.target_sha }}
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Value "Dry run completed. No tag or GitHub Release was created."
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Value "Rerun with ``dry_run=false`` to create ``$env:TAG_NAME`` at ``$env:TARGET_SHA``."

      - name: Write dry-run record
        if: ${{ inputs.dry_run }}
        env:
          TAG_NAME: ${{ steps.preflight.outputs.tag_name }}
          VERSION: ${{ steps.preflight.outputs.version }}
          TARGET_SHA: ${{ steps.preflight.outputs.target_sha }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path ".release-dry-run-cache" -Force | Out-Null
          [pscustomobject]@{
            tag_name = $env:TAG_NAME
            version = $env:VERSION
            target_sha = $env:TARGET_SHA
            dry_run_completed_at = (Get-Date).ToUniversalTime().ToString("o")
            run_id = "${{ github.run_id }}"
            run_attempt = "${{ github.run_attempt }}"
            build_checked = $true
            harness_checked = $true
            release_notes_rendered = $true
          } | ConvertTo-Json | Set-Content -LiteralPath ".release-dry-run-cache\publish-release.json" -Encoding UTF8

      - name: Save dry-run record
        if: ${{ inputs.dry_run }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .release-dry-run-cache
          key: ${{ steps.preflight.outputs.dry_run_cache_prefix }}${{ github.run_id }}-${{ github.run_attempt }}

      - name: Create release tag
        if: ${{ inputs.dry_run == false }}
        env:
          TAG_NAME: ${{ steps.preflight.outputs.tag_name }}
          VERSION: ${{ steps.preflight.outputs.version }}
          TARGET_SHA: ${{ steps.preflight.outputs.target_sha }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git fetch --force --tags origin "refs/tags/$env:TAG_NAME`:refs/tags/$env:TAG_NAME" 2>$null
          $tagExists = -not [string]::IsNullOrWhiteSpace((@(git tag --list $env:TAG_NAME) -join "`n").Trim())
          if ($tagExists) {
            $tagTargetSha = (git rev-parse "$env:TAG_NAME^{commit}").Trim()
            if ($tagTargetSha -ne $env:TARGET_SHA) {
              throw "Release tag $env:TAG_NAME already exists at $tagTargetSha, not target $env:TARGET_SHA."
            }
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Value ""
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Value "Release tag ``$env:TAG_NAME`` already points at ``$env:TARGET_SHA``; reusing it to create the missing GitHub Release."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$env:TAG_NAME" "$env:TARGET_SHA" -m "$env:TAG_NAME"
          git push origin "refs/tags/$env:TAG_NAME"

      - name: Create GitHub release
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.preflight.outputs.tag_name }}
          VERSION: ${{ steps.preflight.outputs.version }}
          TARGET_SHA: ${{ steps.preflight.outputs.target_sha }}
          NOTES_FILE: ${{ steps.release_notes.outputs.notes_file }}
          IS_PRERELEASE: ${{ steps.preflight.outputs.prerelease }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $args = @(
            "release", "create", $env:TAG_NAME,
            "--target", $env:TARGET_SHA,
            "--title", $env:TAG_NAME,
            "--notes-file", $env:NOTES_FILE
          )
          if ($env:IS_PRERELEASE -eq "true") {
            $args += "--prerelease"
          }
          gh @args

      - name: Delete consumed next draft
        if: ${{ inputs.dry_run == false }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.preflight.outputs.tag_name }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $isDraft = gh release view next --json isDraft --jq '.isDraft' 2>$null
          $lookupExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($lookupExit -eq 0 -and $isDraft -eq "true") {
            gh release delete next --yes
            $deleteExit = $LASTEXITCODE
            $global:LASTEXITCODE = 0
            if ($deleteExit -ne 0) {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Value ""
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Value "Warning: GitHub Release ``$env:TAG_NAME`` was created, but cleanup of the ``next`` draft failed. Delete the draft manually before preparing the next release."
              exit $deleteExit
            }
          }
