name: draft-release-notes

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  update-next-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create or update next draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag_name="next"
          title="Upcoming Changes"
          notes_file="$RUNNER_TEMP/next-release-notes.md"

          {
            echo "## Upcoming Changes"
            echo
            echo "This draft is generated from the current \`dev\` branch. It is not a formal release and must not include zip packages, checksums, or local build artifacts."
            echo
            echo "### Recent commits"
            git log --no-merges --pretty=format:'- %s (%h)' -n 30
            echo
            echo
            echo "### Changelog Unreleased"
            awk '/^## Unreleased/{flag=1; next} /^## /{flag=0} flag{print}' CHANGELOG.md
          } > "$notes_file"

          if gh release view "$tag_name" >/dev/null 2>&1; then
            gh release edit "$tag_name" --draft --title "$title" --notes-file "$notes_file" --target dev
          else
            gh release create "$tag_name" --draft --title "$title" --notes-file "$notes_file" --target dev
          fi
