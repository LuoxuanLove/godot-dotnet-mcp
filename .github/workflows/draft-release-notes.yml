name: draft-release-notes

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  update-next-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create or update next draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pluginCfg = Get-Content -LiteralPath "addons/godot_dotnet_mcp/plugin.cfg" -Raw -Encoding UTF8
          if ($pluginCfg -notmatch 'version="([^"]+)"') {
            throw "Cannot find version in addons/godot_dotnet_mcp/plugin.cfg"
          }

          $version = $Matches[1]
          $tagName = "next"
          $title = "Upcoming Changes"
          $notesFile = Join-Path $env:RUNNER_TEMP "next-release-notes.md"

          $versionMentionPattern = "(?<![0-9A-Za-z.-])(?:[vV])?$([regex]::Escape($version))(?![0-9A-Za-z.-])"
          $changelogPaths = @(
            "docs/en/CHANGELOG.md",
            "docs/zh-CN/变更日志.md",
            "docs/ja/変更履歴.md",
            "docs/ko/변경-로그.md"
          )
          foreach ($path in $changelogPaths) {
            $content = Get-Content -LiteralPath $path -Raw -Encoding UTF8
            if ($content -notmatch $versionMentionPattern) {
              throw "$path does not mention release version $version"
            }
          }

          $releaseNotePaths = @(
            "docs/en/process/release-notes/release-notes-v$version.md",
            "docs/zh-CN/流程/发布说明/发布说明-v$version.md",
            "docs/ja/プロセス/リリースノート/リリースノート-v$version.md",
            "docs/ko/프로세스/릴리스-노트/릴리스-노트-v$version.md"
          )
          foreach ($releaseNotesPath in $releaseNotePaths) {
            if (-not (Test-Path -LiteralPath $releaseNotesPath)) {
              throw "Manual release notes file $releaseNotesPath is required for the next release draft."
            }

            $releaseNotes = Get-Content -LiteralPath $releaseNotesPath -Raw -Encoding UTF8
            if ($releaseNotes -notmatch $versionMentionPattern) {
              throw "$releaseNotesPath does not mention release version $version"
            }
          }

          .\scripts\validate_docs_i18n.ps1

          .\scripts\render_release_notes.ps1 `
            -Version $version `
            -OutputPath $notesFile `
            -ManualNotesPath "docs/en/process/release-notes/release-notes-v$version.md" `
            -ChangelogPath "docs/en/CHANGELOG.md" `
            -CommitLimit 30 `
            -PreferUnreleased

          gh release view $tagName *> $null
          $releaseLookupExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($releaseLookupExit -eq 0) {
            gh release edit $tagName --draft --title $title --notes-file $notesFile --target dev
          } elseif ($releaseLookupExit -eq 1) {
            gh release create $tagName --draft --title $title --notes-file $notesFile --target dev
          } else {
            throw "Unable to check whether draft release $tagName exists. gh exited with $releaseLookupExit."
          }
