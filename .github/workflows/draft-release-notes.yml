name: draft-release-notes

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  update-next-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create or update next draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pluginCfg = Get-Content -LiteralPath "addons/godot_dotnet_mcp/plugin.cfg" -Raw -Encoding UTF8
          if ($pluginCfg -notmatch 'version="([^"]+)"') {
            throw "Cannot find version in addons/godot_dotnet_mcp/plugin.cfg"
          }

          $version = $Matches[1]
          $tagName = "next"
          $title = "Upcoming Changes"
          $notesFile = Join-Path $env:RUNNER_TEMP "next-release-notes.md"

          .\scripts\render_release_notes.ps1 `
            -Version $version `
            -OutputPath $notesFile `
            -ManualNotesPath "docs/zh-CN/流程/发布说明/发布说明-v$version.md" `
            -ChangelogPath "docs/zh-CN/变更日志.md" `
            -CommitLimit 30 `
            -PreferUnreleased

          gh release view $tagName *> $null
          $releaseLookupExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($releaseLookupExit -eq 0) {
            gh release edit $tagName --draft --title $title --notes-file $notesFile --target dev
          } elseif ($releaseLookupExit -eq 1) {
            gh release create $tagName --draft --title $title --notes-file $notesFile --target dev
          } else {
            throw "Unable to check whether draft release $tagName exists. gh exited with $releaseLookupExit."
          }
