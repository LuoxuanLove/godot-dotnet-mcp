name: validate-plugin

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - dev
      - "feature/**"
      - "fix/**"
      - "docs/**"
      - "chore/**"
      - "hotfix/**"
      - "release/**"
      - "actions-bot/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-plugin-harness:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-v1-${{ hashFiles('Directory.Build.props', '**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'Directory.Packages.props', 'packages.lock.json', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-v1-

      - name: Cache Godot 4.6
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\godot-4.6-stable-mono-win64
          key: ${{ runner.os }}-godot-4.6-stable-mono-win64-v1

      - name: Setup Godot 4.6
        shell: pwsh
        run: |
          $extractDir = Join-Path $env:RUNNER_TEMP "godot-4.6-stable-mono-win64"
          $godotExe = $null
          if (Test-Path -LiteralPath $extractDir) {
            $godotExe = Get-ChildItem -Path $extractDir -Recurse -Filter "Godot*.exe" -File |
              Where-Object { $_.Name -notmatch "console" } |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if ([string]::IsNullOrWhiteSpace($godotExe)) {
            Remove-Item -LiteralPath $extractDir -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $extractDir -Force | Out-Null
            $godotZip = Join-Path $env:RUNNER_TEMP "Godot_v4.6-stable_mono_win64.exe.zip"
            curl.exe -L --fail --output $godotZip "https://downloads.godotengine.org/?version=4.6&flavor=stable&slug=mono_win64.zip&platform=windows.64"
            Expand-Archive -Path $godotZip -DestinationPath $extractDir -Force
            $godotExe = Get-ChildItem -Path $extractDir -Recurse -Filter "Godot*.exe" -File |
              Where-Object { $_.Name -notmatch "console" } |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if ([string]::IsNullOrWhiteSpace($godotExe)) {
            throw "Godot executable not found in $extractDir."
          }
          echo "GODOT_BIN=$godotExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run plugin harness verification
        shell: pwsh
        run: .\scripts\test_plugin_side_roslyn.ps1 -GodotPath "$env:GODOT_BIN"

      - name: Upload harness failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: plugin-harness-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/godot_plugin_harness/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
