name: validate-plugin

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - dev
      - "feature/**"
      - "fix/**"
      - "docs/**"
      - "chore/**"
      - "hotfix/**"
      - "release/**"
      - "actions-bot/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-plugin-harness:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup Godot 4.6
        shell: pwsh
        run: |
          $godotZip = "$env:TEMP\Godot_v4.6-stable_mono_win64.exe.zip"
          if (-not (Test-Path $godotZip)) {
            curl.exe -L --fail --output $godotZip "https://downloads.godotengine.org/?version=4.6&flavor=stable&slug=mono_win64.zip&platform=windows.64"
          }
          $extractDir = "$env:TEMP\godot_extracted"
          Expand-Archive -Path $godotZip -DestinationPath $extractDir -Force
          $godotExe = Get-ChildItem -Path $extractDir -Recurse -Filter "Godot*.exe" -File | Select-Object -First 1 -ExpandProperty FullName
          echo "GODOT_BIN=$godotExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run plugin harness verification
        shell: pwsh
        run: .\scripts\test_plugin_side_roslyn.ps1 -GodotPath "$env:GODOT_BIN"
