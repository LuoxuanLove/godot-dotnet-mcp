name: actions-bot-relay

on:
  workflow_dispatch:
    inputs:
      patch_base64:
        description: "Base64-encoded unified git patch to apply on dev"
        required: true
        type: string
      pr_title:
        description: "Pull request title"
        required: true
        type: string
      pr_body:
        description: "Pull request body"
        required: true
        type: string
      commit_message:
        description: "Commit message"
        required: true
        type: string
      branch_name:
        description: "Optional actions-bot/* branch name"
        required: false
        type: string
      base_branch:
        description: "Target branch; must be dev"
        required: false
        default: dev
        type: choice
        options:
          - dev

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  relay-patch-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Validate relay inputs
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          BRANCH_NAME: ${{ inputs.branch_name }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
          PR_TITLE: ${{ inputs.pr_title }}
        run: |
          set -euo pipefail

          if [[ "$BASE_BRANCH" != "dev" ]]; then
            echo "::error::actions-bot-relay only targets dev."
            exit 1
          fi

          branch="$BRANCH_NAME"
          if [[ -z "$branch" ]]; then
            branch="actions-bot/${GITHUB_RUN_ID}"
          fi

          if [[ ! "$branch" =~ ^actions-bot/[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::branch_name must be empty or start with actions-bot/ and contain only letters, numbers, dot, underscore, slash, or dash."
            exit 1
          fi

          if [[ "$branch" == *".."* || "$branch" == *"//"* || "$branch" == */. || "$branch" == *./* ]]; then
            echo "::error::branch_name contains an unsafe ref segment."
            exit 1
          fi

          git check-ref-format --branch "$branch"

          if [[ -z "$COMMIT_MESSAGE" || -z "$PR_TITLE" ]]; then
            echo "::error::commit_message and pr_title must be non-empty."
            exit 1
          fi

          if [[ "$COMMIT_MESSAGE" == *$'\n'* || "$PR_TITLE" == *$'\n'* ]]; then
            echo "::error::commit_message and pr_title must be single-line values."
            exit 1
          fi

          if (( ${#COMMIT_MESSAGE} > 200 || ${#PR_TITLE} > 200 )); then
            echo "::error::commit_message and pr_title must be at most 200 characters."
            exit 1
          fi

          echo "branch=$branch" >> "$GITHUB_ENV"

      - name: Apply relay patch
        env:
          PATCH_BASE64: ${{ inputs.patch_base64 }}
        run: |
          set -euo pipefail

          patch_file="$RUNNER_TEMP/actions-bot-relay.patch"
          printf '%s' "$PATCH_BASE64" | tr -d '\r\n ' | base64 --decode > "$patch_file"

          if [[ ! -s "$patch_file" ]]; then
            echo "::error::Decoded patch is empty."
            exit 1
          fi

          git apply --check "$patch_file"
          git apply --index "$patch_file"

          if git diff --cached --quiet; then
            echo "::error::Patch applied cleanly but produced no staged changes."
            exit 1
          fi

      - name: Commit relay changes
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "$COMMIT_MESSAGE"

      - name: Push relay branch
        run: |
          set -euo pipefail
          git push --force-with-lease --set-upstream origin "HEAD:$branch"

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_BODY: ${{ inputs.pr_body }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          set -euo pipefail

          pr_body_file="$RUNNER_TEMP/actions-bot-relay-pr-body.md"
          printf '%s\n' "$PR_BODY" > "$pr_body_file"

          existing_pr=$(gh pr list --head "$branch" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" --title "$PR_TITLE" --body-file "$pr_body_file" --base "$BASE_BRANCH"
            echo "Updated PR #$existing_pr"
          else
            gh pr create --base "$BASE_BRANCH" --head "$branch" --title "$PR_TITLE" --body-file "$pr_body_file"
          fi

      - name: Trigger validation workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh workflow run validate-plugin.yml --ref "$branch"

          if git diff --name-only "origin/dev...HEAD" | grep -q '^\.github/workflows/'; then
            gh workflow run lint-workflows.yml --ref "$branch"
          fi