name: pr-policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
  workflow_dispatch:
    inputs:
      pull_number:
        description: "Pull request number to validate"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-target-dev:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest

    steps:
      - name: Require allowed target branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pull_number }}
        run: |
          set -euo pipefail

          if [[ -z "$PR_NUMBER" ]]; then
            echo "::error::Unable to determine pull request number."
            exit 1
          fi

          base_ref=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq '.baseRefName')
          case "$base_ref" in
            dev|refactor/v1.4.0|refactor/v2.0.0|v2.0|release/v2.0.0-baseline|feature/v2-*|docs/v2-*|ci/v2-*)
              ;;
            *)
              echo "::error::Pull requests must target dev, refactor/v1.4.0, refactor/v2.0.0, v2.0, release/v2.0.0-baseline, or a v2 stacked base branch. Change the PR base branch before merging."
              exit 1
              ;;
          esac

  pr-standards:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Validate objective PR fields
        if: github.event_name != 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pull_number }}
        run: |
          set -euo pipefail

          if [[ -z "$PR_NUMBER" ]]; then
            echo "::error::Unable to determine pull request number."
            exit 1
          fi

          pr_fields_file="$RUNNER_TEMP/pr-policy-fields.json"
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title,body > "$pr_fields_file"

          python scripts/validate_pr_policy.py --fields-json "$pr_fields_file"

      - name: Run PR policy regression tests
        run: python scripts/test_validate_pr_policy.py
