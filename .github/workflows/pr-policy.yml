name: pr-policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_number:
        description: "Pull request number to validate"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-target-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Require allowed target branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pull_number }}
        run: |
          set -euo pipefail

          if [[ -z "$PR_NUMBER" ]]; then
            echo "::error::Unable to determine pull request number."
            exit 1
          fi

          base_ref=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq '.baseRefName')
          if [[ "$base_ref" != "dev" && "$base_ref" != "refactor/v1.4.0" ]]; then
            echo "::error::Pull requests must target dev or refactor/v1.4.0. Change the PR base branch before merging."
            exit 1
          fi

  pr-standards:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Validate objective PR fields
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pull_number }}
        run: |
          set -euo pipefail

          if [[ -z "$PR_NUMBER" ]]; then
            echo "::error::Unable to determine pull request number."
            exit 1
          fi

          pr_fields_file="$RUNNER_TEMP/pr-policy-fields.json"
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title,body > "$pr_fields_file"

          python scripts/validate_pr_policy.py --fields-json "$pr_fields_file"
