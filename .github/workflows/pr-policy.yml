name: pr-policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  pr-target-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Require dev target branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$BASE_REF" != "dev" ]]; then
            echo "::error::All pull requests must target dev. Change the PR base branch to dev before merging."
            exit 1
          fi
