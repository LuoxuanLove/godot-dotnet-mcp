name: pr-policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  pr-target-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Require dev target branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$BASE_REF" != "dev" ]]; then
            echo "::error::All pull requests must target dev. Change the PR base branch to dev before merging."
            exit 1
          fi

  pr-standards:
    runs-on: ubuntu-latest

    steps:
      - name: Validate objective PR fields
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as event_file:
              event = json.load(event_file)

          pull_request = event.get("pull_request") or {}
          title = (pull_request.get("title") or "").strip()
          body = pull_request.get("body") or ""
          errors = []

          title_pattern = re.compile(r"^(feat|fix|docs|ci|chore|perf|refactor|test|build|hotfix)(\([a-z0-9._/-]+\))?: .+", re.IGNORECASE)
          if not title_pattern.match(title):
              errors.append("PR title must use Conventional Commits format, for example 'fix(scope): concise summary'.")

          required_sections = [
              "Summary",
              "Scope",
              "Root Cause / Why",
              "Changes",
              "Verification",
              "Changelog / Docs",
              "Risk / Process Impact",
              "Checklist",
          ]

          def section_match(section_name: str):
              pattern = re.compile(rf"^##\s+{re.escape(section_name)}\s*$", re.IGNORECASE | re.MULTILINE)
              return pattern.search(body)

          def section_text(section_name: str) -> str:
              match = section_match(section_name)
              if match is None:
                  return ""
              next_heading = re.search(r"^##\s+", body[match.end():], re.MULTILINE)
              end = match.end() + next_heading.start() if next_heading else len(body)
              return body[match.end():end]

          def has_substantive_content(section_name: str) -> bool:
              text = re.sub(r"<!--.*?-->", "", section_text(section_name), flags=re.DOTALL)
              for raw_line in text.splitlines():
                  line = raw_line.strip()
                  if not line or line in {"-", "```", "```powershell", "```text"}:
                      continue
                  if re.fullmatch(r"- \[[ xX]\].*", line):
                      continue
                  if line.startswith("# Example:") or "<Godot Editor Path>" in line:
                      continue
                  if re.fullmatch(r"- (CHANGELOG\.md|CHANGELOG\.zh-CN\.md|Docs):", line, re.IGNORECASE):
                      continue
                  return True
              return False

          for section in required_sections:
              if section_match(section) is None:
                  errors.append(f"PR body must include '## {section}'.")

          for section in ["Summary", "Verification", "Changelog / Docs", "Risk / Process Impact"]:
              if section_match(section) is not None and not has_substantive_content(section):
                  errors.append(f"PR body section '## {section}' must include a concrete statement, not only template placeholders.")

          changelog_docs = section_text("Changelog / Docs")
          if section_match("Changelog / Docs") is not None:
              if "CHANGELOG.md" not in changelog_docs or "CHANGELOG.zh-CN.md" not in changelog_docs:
                  errors.append("'## Changelog / Docs' must mention both CHANGELOG.md and CHANGELOG.zh-CN.md, or explain why each is not required.")

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)

          print("PR standards validated.")
          PY
