name: validate-refactor

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "v*-dev"

jobs:
  build-host:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build central server
        shell: pwsh
        run: dotnet build .\central_server\CentralServer.csproj -c Release

      - name: Build host shared library
        shell: pwsh
        run: dotnet build .\host_shared\HostShared.csproj -c Release

      - name: Run host contract tests
        shell: pwsh
        run: dotnet run --project .\tests\host_contracts\HostContracts.csproj -c Release

      - name: Setup Godot 4.3
        shell: pwsh
        run: |
          $godotZip = "$env:TEMP\Godot_v4.3-stable_win64_cmdline.zip"
          if (-not (Test-Path $godotZip)) {
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_win64_cmdline.zip" -OutFile $godotZip
          }
          Expand-Archive -Path $godotZip -DestinationPath $env:GITHUB_WORKSPACE -Force
          $godotExe = "$env:GITHUB_WORKSPACE\Godot_v4.3-stable_win64_cmdline.exe"
          echo "GODOT_BIN=$godotExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run plugin headless harness
        shell: pwsh
        run: dotnet run --project .\tests\godot_plugin_harness\GodotPluginHarness.csproj -c Release

      - name: Run reuse session smoke
        shell: pwsh
        run: .\scripts\smoke_central_server_system_session.ps1 -SkipBuild

      - name: Validate refactor guardrails
        shell: pwsh
        run: .\scripts\validate_refactor_guardrails.ps1
