name: version-policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_number:
        description: "Pull request number to validate"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  version-policy:
    runs-on: windows-2025

    steps:
      - name: Resolve pull request refs
        id: pr
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PULL_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PULL_NUMBER: ${{ github.event.inputs.pull_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"

          $pullNumber = $env:EVENT_PULL_NUMBER
          if ([string]::IsNullOrWhiteSpace($pullNumber)) {
            $pullNumber = $env:INPUT_PULL_NUMBER
          }
          if ([string]::IsNullOrWhiteSpace($pullNumber)) {
            throw "Unable to determine pull request number."
          }

          $pr = gh pr view $pullNumber --repo $env:REPOSITORY --json baseRefName,headRefName,headRepositoryOwner | ConvertFrom-Json
          $trustedPolicyRef = $pr.baseRefName
          if (
            ($pr.baseRefName -eq "v2.0" -and $pr.headRefName -eq "release/v2.0.0-baseline") -or
            $pr.baseRefName -eq "release/v2.0.0-baseline" -or
            $pr.baseRefName.StartsWith("feature/v2-", [System.StringComparison]::Ordinal) -or
            $pr.baseRefName.StartsWith("docs/v2-", [System.StringComparison]::Ordinal) -or
            $pr.baseRefName.StartsWith("ci/v2-", [System.StringComparison]::Ordinal)
          ) {
            $trustedPolicyRef = "release/v2.0.0-baseline"
          }

          "pull_number=$pullNumber" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "base_branch=$($pr.baseRefName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "head_branch=$($pr.headRefName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "head_owner=$($pr.headRepositoryOwner.login)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "trusted_policy_ref=$trustedPolicyRef" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout trusted policy scripts
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.trusted_policy_ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch pull request base
        shell: pwsh
        env:
          BASE_BRANCH: ${{ steps.pr.outputs.base_branch }}
          PULL_NUMBER: ${{ steps.pr.outputs.pull_number }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/$($env:BASE_BRANCH):refs/remotes/base/$($env:PULL_NUMBER)"

      - name: Fetch pull request head
        shell: pwsh
        env:
          PULL_NUMBER: ${{ steps.pr.outputs.pull_number }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          HEAD_OWNER: ${{ steps.pr.outputs.head_owner }}
        run: git fetch --no-tags --depth=1 origin "+refs/pull/$env:PULL_NUMBER/head:refs/remotes/pull/$env:PULL_NUMBER/head"

      - name: Validate public version metadata policy
        shell: pwsh
        env:
          BASE_BRANCH: ${{ steps.pr.outputs.base_branch }}
          HEAD_BRANCH: ${{ steps.pr.outputs.head_branch }}
          PULL_NUMBER: ${{ steps.pr.outputs.pull_number }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          HEAD_OWNER: ${{ steps.pr.outputs.head_owner }}
        run: |
          .\scripts\validate_pr_version_policy.ps1 `
            -BaseBranch $env:BASE_BRANCH `
            -HeadBranch $env:HEAD_BRANCH `
            -BaseRef "refs/remotes/base/$env:PULL_NUMBER" `
            -HeadRef "refs/remotes/pull/$env:PULL_NUMBER/head" `
            -RepositoryOwner $env:REPOSITORY_OWNER `
            -HeadRepositoryOwner $env:HEAD_OWNER `
            -RequireTrustedReleaseBranch `
            -SkipFetch
