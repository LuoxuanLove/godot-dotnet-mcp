name: publish-plugin

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: windows-2025
    outputs:
      notes_file_name: ${{ steps.release_notes.outputs.notes_file_name }}
      prerelease: ${{ steps.release_notes.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run release preflight
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $tagName = $env:TAG_NAME
          $semverPattern = '0|[1-9]\d*'
          $prereleaseIdentifierPattern = '(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          $tagPattern = "^v(($semverPattern)\.($semverPattern)\.($semverPattern)(?:-$prereleaseIdentifierPattern(?:\.$prereleaseIdentifierPattern)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)$"
          if ($tagName -notmatch $tagPattern) {
            throw "Release tags must use v* format. Actual tag: $tagName"
          }

          $tagVersion = $Matches[1]
          $tagSha = (git rev-parse HEAD).Trim()
          git merge-base --is-ancestor $tagSha origin/dev
          if ($LASTEXITCODE -ne 0) {
            $global:LASTEXITCODE = 0
            throw "Release tag $tagName must point to a commit reachable from origin/dev. Actual SHA: $tagSha"
          }

          $pluginCfg = Get-Content -LiteralPath "addons/godot_dotnet_mcp/plugin.cfg" -Raw -Encoding UTF8
          if ($pluginCfg -notmatch 'version="([^"]+)"') {
            throw "Cannot find version in addons/godot_dotnet_mcp/plugin.cfg"
          }

          $pluginVersion = $Matches[1]
          if ($pluginVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match plugin.cfg version $pluginVersion"
          }

          $versionMentionPattern = "(?<![0-9A-Za-z.-])(?:[vV])?$([regex]::Escape($tagVersion))(?![0-9A-Za-z.-])"
          .\scripts\validate_release_changelog_section.ps1 -Version $tagVersion

          $releaseNotePaths = @(
            "docs/en/process/release-notes/release-notes-v$tagVersion.md",
            "docs/zh-CN/流程/发布说明/发布说明-v$tagVersion.md",
            "docs/ja/プロセス/リリースノート/リリースノート-v$tagVersion.md",
            "docs/ko/프로세스/릴리스-노트/릴리스-노트-v$tagVersion.md"
          )
          foreach ($releaseNotesPath in $releaseNotePaths) {
            if (-not (Test-Path -LiteralPath $releaseNotesPath)) {
              throw "Manual release notes file $releaseNotesPath is required for a formal release."
            }

            $releaseNotes = Get-Content -LiteralPath $releaseNotesPath -Raw -Encoding UTF8
            if ($releaseNotes -notmatch $versionMentionPattern) {
              throw "$releaseNotesPath does not mention release version $tagVersion"
            }
          }

          .\scripts\validate_docs_i18n.ps1

      - name: Verify hosted .NET 8 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet --info
          dotnet --list-sdks
          $sdkVersion = dotnet --version
          if ($sdkVersion -notmatch '^8\.') {
            throw "Expected global.json to select a .NET 8 SDK, got $sdkVersion."
          }

      - name: Build plugin Roslyn library
        shell: pwsh
        run: dotnet build .\addons\godot_dotnet_mcp\dotnet_bridge\DotnetBridge.csproj -c Release

      - name: Build Companion contract library
        shell: pwsh
        run: .\scripts\dotnet_build_failure_diagnostics.ps1 -Description "Build Companion contract library" -ProjectPath ".\companion\GodotDotnetMcp.Companion\GodotDotnetMcp.Companion.csproj" -Configuration Release

      - name: Run Companion contract tests
        shell: pwsh
        run: dotnet run --project ".\tests\companion_contracts\GodotDotnetMcp.Companion.Contracts.csproj" -c Release

      - name: Build Companion static analyzer
        shell: pwsh
        run: .\scripts\dotnet_build_failure_diagnostics.ps1 -Description "Build Companion static analyzer" -ProjectPath ".\companion\GodotDotnetMcp.Companion.StaticAnalysis\GodotDotnetMcp.Companion.StaticAnalysis.csproj" -Configuration Release

      - name: Run Companion static analyzer tests
        shell: pwsh
        run: dotnet run --project ".\tests\static_project_analyzer\GodotDotnetMcp.Companion.StaticAnalysis.Tests.csproj" -c Release

      - name: Validate v2 bridge contract
        shell: pwsh
        run: .\scripts\validate_v2_bridge_contract.ps1

      - name: Run v2 bridge contract tests
        shell: pwsh
        run: .\scripts\test_v2_bridge_contract.ps1

      - name: Validate v2 broker manifest
        shell: pwsh
        run: .\scripts\validate_v2_broker_manifest.ps1

      - name: Run v2 broker manifest tests
        shell: pwsh
        run: .\scripts\test_v2_broker_manifest.ps1

      - name: Setup Godot 4.6
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $godotZip = "$env:TEMP\Godot_v4.6-stable_mono_win64.exe.zip"
          if (-not (Test-Path $godotZip)) {
            curl.exe -L --fail --output $godotZip "https://downloads.godotengine.org/?version=4.6&flavor=stable&slug=mono_win64.zip&platform=windows.64"
          }
          $extractDir = "$env:TEMP\godot_extracted"
          Expand-Archive -Path $godotZip -DestinationPath $extractDir -Force
          $godotExe = Get-ChildItem -Path $extractDir -Recurse -Filter "*console*.exe" -File | Sort-Object FullName | Select-Object -First 1
          if ($null -eq $godotExe) {
            throw "Cannot find the Godot console executable in $extractDir."
          }
          echo "GODOT_BIN=$($godotExe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run plugin harness verification
        shell: pwsh
        run: .\scripts\test_plugin_side_roslyn.ps1 -GodotPath "$env:GODOT_BIN"

      - name: Render release notes
        id: release_notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"

          $tagName = $env:TAG_NAME
          $semverPattern = '0|[1-9]\d*'
          $prereleaseIdentifierPattern = '(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          $tagPattern = "^v(($semverPattern)\.($semverPattern)\.($semverPattern)(?:-$prereleaseIdentifierPattern(?:\.$prereleaseIdentifierPattern)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)$"
          if ($tagName -notmatch $tagPattern) {
            throw "Release tags must use v* format. Actual tag: $tagName"
          }

          $tagVersion = $Matches[1]
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes-$tagVersion.md"

          .\scripts\render_release_notes.ps1 `
            -Version $tagVersion `
            -OutputPath $notesFile `
            -ManualNotesPath "docs/en/process/release-notes/release-notes-v$tagVersion.md" `
            -ChangelogPath "docs/en/CHANGELOG.md" `
            -TagName $tagName `
            -CommitLimit 30

          $isPrerelease = (($tagVersion -match '^\d+\.\d+\.\d+-').ToString().ToLowerInvariant())
          "notes_file=$notesFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "notes_file_name=release-notes-$tagVersion.md" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload release notes
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ steps.release_notes.outputs.notes_file }}
          if-no-files-found: error
