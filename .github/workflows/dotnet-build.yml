name: dotnet-build

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dotnet-build:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify hosted .NET 8 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet --info
          dotnet --list-sdks
          $sdkVersion = dotnet --version
          if ($sdkVersion -notmatch '^8\.') {
            throw "Expected global.json to select a .NET 8 SDK, got $sdkVersion."
          }

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-v1-${{ hashFiles('Directory.Build.props', '**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'Directory.Packages.props', 'packages.lock.json', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-v1-

      - name: Build plugin Roslyn library
        shell: pwsh
        run: .\scripts\dotnet_build_failure_diagnostics.ps1 -Description "Build plugin Roslyn library" -ProjectPath ".\addons\godot_dotnet_mcp\dotnet_bridge\DotnetBridge.csproj" -Configuration Release

      - name: Build Companion contract library
        shell: pwsh
        run: .\scripts\dotnet_build_failure_diagnostics.ps1 -Description "Build Companion contract library" -ProjectPath ".\companion\GodotDotnetMcp.Companion\GodotDotnetMcp.Companion.csproj" -Configuration Release

      - name: Run Companion contract tests
        shell: pwsh
        run: dotnet run --project ".\tests\companion_contracts\GodotDotnetMcp.Companion.Contracts.csproj" -c Release

      - name: Build Companion static analyzer
        shell: pwsh
        run: .\scripts\dotnet_build_failure_diagnostics.ps1 -Description "Build Companion static analyzer" -ProjectPath ".\companion\GodotDotnetMcp.Companion.StaticAnalysis\GodotDotnetMcp.Companion.StaticAnalysis.csproj" -Configuration Release

      - name: Run Companion static analyzer tests
        shell: pwsh
        run: dotnet run --project ".\tests\static_project_analyzer\GodotDotnetMcp.Companion.StaticAnalysis.Tests.csproj" -c Release

      - name: Build harness runner
        shell: pwsh
        run: .\scripts\dotnet_build_failure_diagnostics.ps1 -Description "Build harness runner" -ProjectPath ".\tests\godot_plugin_harness\GodotPluginHarness.csproj" -Configuration Release

      - name: Build fixture Godot C# project
        shell: pwsh
        run: .\scripts\dotnet_build_failure_diagnostics.ps1 -Description "Build fixture Godot C# project" -ProjectPath ".\tests\godot_plugin_harness_fixture\GodotDotnetMcpPluginHarness.csproj" -Configuration Release

      - name: Validate refactor guardrails
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $guardrailArgs = @()
          if ($env:EVENT_NAME -eq "pull_request") {
            $guardrailArgs += "-SkipVersionPolicy"
          }
          .\scripts\validate_refactor_guardrails.ps1 @guardrailArgs
